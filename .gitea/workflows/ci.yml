name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Install CI dependencies
        run: make ci-deps

      - name: Run tests
        run: make test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CI dependencies
        run: make ci-deps

      - name: Install Node dependencies
        run: npm install

      - name: Install documentation dependencies
        run: cd docs-site && npm install

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint Go
        run: make lint-go

      - name: Lint Templ
        run: make lint-templ

      - name: Lint YAML
        run: make lint-yaml

      - name: Lint Markdown
        run: make lint-md

      - name: Lint Docker
        run: make lint-docker
        continue-on-error: true

      - name: Lint docs (Docusaurus build)
        run: make lint-docs
        continue-on-error: true
