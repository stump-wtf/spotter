# Gitea Actions: build + scan + push the Spotter image, then (on merge to main) deploy it to ie01
# via Ansible. Governing: ADR-0045 (on-merge CI deploy for owned services) — the deploy job runs only
# after the image is pushed :latest (needs: [image]) and is gated off (vars.DEPLOY_ON_MERGE) until
# dub.yaml's spotter entry points at the mirror image.
#
# Modeled directly on stump.wtf/cairn's build.yaml, which is the reference implementation of ADR-0045.
#
# Image: gitea.stump.rocks/stump.wtf/spotter (under the stump.wtf org, alongside the repo). Registry
# auth: a purpose-scoped REGISTRY_TOKEN repo secret (a joestump-agent PAT with write:package;
# joestump-agent is a stump.wtf Owner) is required. Until it is set every image step skips and the
# job stays green.
#
# NOTE: .github/workflows/ci.yml still lints, tests, and publishes to ghcr.io for public consumption.
# This workflow is additive — it puts the image in the local mirror so the cluster can pull it
# without egress, exactly as cairn does.
name: build-and-push

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: build + scan + push
    runs-on: ubuntu-latest
    env:
      # Step-level `if: env.REG != ''` gates the whole job on the secret (secrets can't be used in
      # `if` directly). No token → all steps skip → job is green.
      REG: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - if: ${{ env.REG != '' }}
        uses: actions/checkout@v4

      - if: ${{ env.REG != '' }}
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - if: ${{ env.REG != '' }}
        name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: gitea.stump.rocks/stump.wtf/spotter
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - if: ${{ env.REG != '' }}
        name: Log in to Gitea container registry
        uses: docker/login-action@v3
        with:
          registry: gitea.stump.rocks
          username: joestump-agent
          password: ${{ secrets.REGISTRY_TOKEN }}

      - if: ${{ env.REG != '' }}
        name: Build amd64 image for Trivy scan
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: gitea.stump.rocks/stump.wtf/spotter:scan-${{ gitea.run_id }}
          cache-from: type=registry,ref=gitea.stump.rocks/stump.wtf/spotter:buildcache

      - if: ${{ env.REG != '' }}
        name: Trivy image scan
        uses: docker://aquasec/trivy:latest
        with:
          args: image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --format table gitea.stump.rocks/stump.wtf/spotter:scan-${{ gitea.run_id }}

      - if: ${{ env.REG != '' }}
        name: Build and push (amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=gitea.stump.rocks/stump.wtf/spotter:buildcache
          cache-to: type=registry,ref=gitea.stump.rocks/stump.wtf/spotter:buildcache,mode=max

  deploy:
    name: deploy to ie01 (ansible)
    needs: [image]
    # Inert until dub.yaml's spotter entry points at gitea.stump.rocks/stump.wtf/spotter:latest.
    # It currently pins ghcr.io/joestump/spotter:0.3.9, so a deploy today would re-apply that pinned
    # tag and roll nothing. Set repo variable DEPLOY_ON_MERGE=true once the inventory is switched.
    # Only fires on a push to main (never PRs / workflow_dispatch), after the image job.
    if: ${{ vars.DEPLOY_ON_MERGE == 'true' && gitea.event_name == 'push' && gitea.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      ANSIBLE_FORCE_COLOR: 'true'
      DOCKER_TIMEOUT: 600
      # AppRole rather than a static token. A static VAULT_TOKEN in a repo secret cannot
      # re-authenticate: it dies at max-TTL and takes every subsequent deploy with it, silently —
      # the 2026-07-01 vault-agent OMG, repeated in CI. The runner logs in per run and exports a
      # short-lived token. Requires ansible-runner >= v2.
      VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
      VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
    steps:
      - name: Checkout stumpcloud/ansible (playbooks + inventory)
        uses: actions/checkout@v4
        with:
          repository: stumpcloud/ansible
          ref: main
          token: ${{ secrets.GIT_AUTH_TOKEN }}
      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Log in to Gitea (pull the ansible-runner action image)
        uses: docker/login-action@v3
        with:
          registry: gitea.stump.rocks
          username: joestump-agent
          password: ${{ secrets.GIT_AUTH_TOKEN }}
      - name: Deploy Spotter to ie01
        uses: https://gitea.stump.rocks/stumpcloud/ansible-runner@v2
        with:
          playbook: playbooks/services/spotter.yaml
          inventory: dub.yaml
          ssh_hosts: ie01.stump.rocks
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}